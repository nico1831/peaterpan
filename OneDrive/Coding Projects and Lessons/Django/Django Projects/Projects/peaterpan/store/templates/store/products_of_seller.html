{% extends 'store/layout.html' %}

{% block title %}store - Hobby Site{% endblock %}

{% block body %}
    <p>{{seller_profile.display_name}}'s products</p>
    {% for product in products_of_seller %}
        <li>
            <a href="{% url 'store:show_product_details' product.id %}" class="btn">
                {{ product.name }}
            </a>
        </li>
    {% endfor %}
{% endblock %}
